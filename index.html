<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Attendance & Payroll</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #f4f6f8;
            color: #222;
        }

        header {
            background: #222;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            max-width: 900px;
            margin: 30px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin: 5px;
            font-weight: bold;
        }

        .punch-in {
            background: #28a745;
            color: white;
        }

        .punch-out {
            background: #dc3545;
            color: white;
        }

        #message {
            margin-top: 15px;
            font-weight: bold;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center;
        }

        th {
            background: #eee;
        }
    </style>
</head>

<body>

<header>
    <h1>Employee Attendance & Payroll System</h1>
    <p>Office Attendance Management</p>
</header>

<div class="container">

    <div class="card">
        <h2>Employee Punch</h2>

        <input
            type="text"
            id="employeeId"
            placeholder="Enter Employee ID"
        >

        <button class="punch-in" onclick="punchIn()">
            Punch In
        </button>

        <button class="punch-out" onclick="punchOut()">
            Punch Out
        </button>

        <p id="message"></p>
    </div>

    <div class="card">
        <h2>Today's Attendance</h2>

        <table>
            <thead>
                <tr>
                    <th>Employee ID</th>
                    <th>Punch In</th>
                    <th>Punch Out</th>
                    <th>Status</th>
                </tr>
            </thead>

            <tbody id="attendanceTable"></tbody>
        </table>
    </div>

</div>

<script>
    let attendance = {};

    function getTime() {
        return new Date().toLocaleTimeString();
    }

    function punchIn() {
        const id = document.getElementById("employeeId").value.trim();

        if (id === "") {
            alert("Please enter Employee ID");
            return;
        }

        if (attendance[id]) {
            alert("Employee already punched in.");
            return;
        }

        attendance[id] = {
            punchIn: getTime(),
            punchOut: "-",
            status: "Present"
        };

        document.getElementById("message").innerText =
            "Punch In successful for " + id;

        document.getElementById("employeeId").value = "";

        showAttendance();
    }

    function punchOut() {
        const id = document.getElementById("employeeId").value.trim();

        if (id === "") {
            alert("Please enter Employee ID");
            return;
        }

        if (!attendance[id]) {
            alert("Employee has not punched in.");
            return;
        }

        attendance[id].punchOut = getTime();

        document.getElementById("message").innerText =
            "Punch Out successful for " + id;

        document.getElementById("employeeId").value = "";

        showAttendance();
    }

    function showAttendance() {
        const table = document.getElementById("attendanceTable");

        table.innerHTML = "";

        for (const id in attendance) {
            const row = document.createElement("tr");

            row.innerHTML = `
                <td>${id}</td>
                <td>${attendance[id].punchIn}</td>
                <td>${attendance[id].punchOut}</td>
                <td>${attendance[id].status}</td>
            `;

            table.appendChild(row);
        }
    }
</script>

</body>
</html>
